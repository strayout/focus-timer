[package]
name = "yike-focus-timer"
version = "0.1.0"
description = "一刻 Focus Timer desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
